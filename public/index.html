<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101418">
    <title>Jarvis</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="Estado do Jarvis">
        <div>
          <p class="eyebrow">IA particular</p>
          <h1>Jarvis</h1>
        </div>
        <div class="status" id="status">
          <span class="dot"></span>
          <span>verificando</span>
        </div>
      </section>

      <section class="workspace">
        <aside class="memory-panel" aria-label="Memorias permanentes">
          <div class="panel-head">
            <h2>Memoria</h2>
            <button class="icon-button" id="refreshMemory" title="Atualizar memoria" aria-label="Atualizar memoria">R</button>
          </div>
          <label class="mode-field" for="modeSelect">
            <span>Modo</span>
            <select id="modeSelect">
              <option value="auto">Auto</option>
              <option value="local">Local privado</option>
              <option value="programmer">Programador forte</option>
            </select>
          </label>
          <div class="voice-panel" aria-label="Controles de voz">
            <div class="voice-actions">
              <button class="secondary-button" id="voiceButton" type="button">Falar</button>
              <label class="voice-toggle">
                <input id="speakToggle" type="checkbox" checked>
                <span>Responder em voz</span>
              </label>
            </div>
            <label class="mode-field" for="voiceSelect">
              <span>Voz</span>
              <select id="voiceSelect">
                <option value="">Automatica pt-BR</option>
              </select>
            </label>
          </div>
          <form id="memoryForm" class="memory-form">
            <input id="memoryInput" autocomplete="off" placeholder="Ex.: meu notebook e Windows">
            <button type="submit">Salvar</button>
          </form>
          <ul id="memoryList" class="memory-list"></ul>
        </aside>

        <section class="chat-panel" aria-label="Conversa com Jarvis">
          <div class="tabs" aria-label="Areas do Jarvis">
            <button class="tab-button active" type="button" data-tab="chat">Chat</button>
            <button class="tab-button" type="button" data-tab="settings">Config</button>
            <button class="tab-button" type="button" data-tab="tools">Projetos</button>
            <button class="tab-button" type="button" data-tab="diagnostics">Diagnostico</button>
          </div>
          <div id="messages" class="messages"></div>
          <section class="settings-panel hidden" id="settingsPanel" aria-label="Configuracao do Jarvis">
            <form id="settingsForm" class="settings-grid">
              <label><span>Porta</span><input id="configPort" inputmode="numeric"></label>
              <label><span>Ollama URL</span><input id="configOllamaUrl"></label>
              <label><span>Modelo local</span><input id="configLocalModel"></label>
              <label><span>OpenAI API Key</span><input id="configOpenaiApiKey" type="password" placeholder="deixe vazio para manter"></label>
              <label><span>Modelo OpenAI</span><input id="configOpenaiModel"></label>
              <label><span>Raciocinio</span><input id="configOpenaiReasoning"></label>
              <label><span>Pasta de projetos</span><input id="configProjectsRoot" placeholder="C:\Users\voce\Projetos"></label>
              <label><span>Pastas extras permitidas</span><textarea id="configAllowedDirs" rows="3" placeholder="Uma pasta por linha"></textarea></label>
              <label class="check-row"><input id="configTtsEnabled" type="checkbox"><span>Usar voz neural OpenAI</span></label>
              <label><span>Modelo TTS</span><input id="configTtsModel"></label>
              <label><span>Voz TTS</span><input id="configTtsVoice"></label>
              <button type="submit">Salvar configuracao</button>
            </form>
          </section>
          <section class="tools-panel hidden" id="toolsPanel" aria-label="Ferramentas de programacao">
            <div class="tool-grid">
              <label><span>Caminho</span><input id="toolPath" placeholder="Pasta ou arquivo dentro dos projetos permitidos"></label>
              <div class="tool-actions">
                <button class="secondary-button" id="listFilesButton" type="button">Listar</button>
                <button class="secondary-button" id="readFileButton" type="button">Ler</button>
              </div>
              <label><span>Conteudo para gravar</span><textarea id="toolContent" rows="6"></textarea></label>
              <button class="secondary-button" id="writeFileButton" type="button">Gravar arquivo</button>
              <label><span>Comando</span><input id="toolCommand" placeholder="npm, git ou node"></label>
              <label><span>Argumentos</span><input id="toolArgs" placeholder="run test"></label>
              <button class="secondary-button" id="runCommandButton" type="button">Rodar comando</button>
            </div>
            <pre id="toolOutput" class="output-panel"></pre>
          </section>
          <section class="diagnostics-panel hidden" id="diagnosticsPanel" aria-label="Diagnostico">
            <button class="secondary-button" id="diagnosticsButton" type="button">Atualizar diagnostico</button>
            <pre id="diagnosticsOutput" class="output-panel"></pre>
          </section>
          <form id="chatForm" class="composer">
            <textarea id="messageInput" rows="2" placeholder="Fale com o Jarvis..." autofocus></textarea>
            <button id="sendButton" type="submit">Enviar</button>
          </form>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
